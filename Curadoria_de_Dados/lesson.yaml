  AnswerTests: omnitest(correctExpr='colSums(is.na(dados))')
  Hint: "Digite colSums(is.na(dados))."

- Class: mult_question
  Output: "São 35 ausentes em CTmax e 107 em Sex, de 225 animais. O que esses números mudam na sua análise?"
  AnswerChoices: Qualquer modelo com Sex vai usar menos da metade dos animais;Nada, porque o R ignora NA sozinho;Só mudam se forem mais de 50% em todas as colunas
  CorrectAnswer: Qualquer modelo com Sex vai usar menos da metade dos animais
  AnswerTests: omnitest(correctVal='Qualquer modelo com Sex vai usar menos da metade dos animais')
  Hint: "O lm() descarta a linha inteira quando falta um valor em qualquer variável do modelo."

- Class: text
  Output: "O arquivo também traz duas colunas derivadas: Tbr, que deveria ser CTmax menos CTmin, e WT, que deveria ser CTmax menos BIO_5."

- Class: cmd_question
  Output: "Confira a primeira com all.equal(dados$Tbr, dados$CTmax - dados$CTmin)."
  CorrectAnswer: all.equal(dados$Tbr, dados$CTmax - dados$CTmin)
  AnswerTests: omnitest(correctExpr='all.equal(dados$Tbr, dados$CTmax - dados$CTmin)')
  Hint: "Digite all.equal(dados$Tbr, dados$CTmax - dados$CTmin)."

- Class: text
  Output: "O all.equal() não devolveu TRUE: há uma diferença relativa média de cerca de 7 em 100 mil. Ela vem de arredondamento, e não de erro grosseiro, mas mostra o ponto: a coluna guardada e a conta que a gerou já não são a mesma coisa. Coluna derivada boa é a que o script recalcula, como fizemos na aula 04."

- Class: cmd_question
