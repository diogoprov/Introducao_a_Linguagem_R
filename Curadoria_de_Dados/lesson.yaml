  CorrectAnswer: table(dados$Altitude_categorical, dados$Altitude_m)
  AnswerTests: omnitest(correctExpr='table(dados$Altitude_categorical, dados$Altitude_m)')
  Hint: "Digite table(dados$Altitude_categorical, dados$Altitude_m)."

- Class: text
  Output: "Cada categoria corresponde a uma única altitude, porque Altitude_categorical é a serra e a altitude coladas num texto só. Ela não acrescenta informação a Mountain_Range mais Altitude_m, e ainda esconde duas variáveis dentro de uma célula."

