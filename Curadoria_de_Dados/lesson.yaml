  AnswerTests: omnitest(correctExpr='tapply(dados$BIO_5, dados$Altitude_m, sd)')
  Hint: "Digite tapply(dados$BIO_5, dados$Altitude_m, sd)."

- Class: mult_question
  Output: "Todos os desvios são zero. O que isso diz sobre BIO_5?"
  AnswerChoices: É uma variável do sítio, repetida em todas as linhas de indivíduos daquele sítio;Que os animais do mesmo sítio têm a mesma temperatura corporal;Que a coluna foi preenchida errado
  CorrectAnswer: É uma variável do sítio, repetida em todas as linhas de indivíduos daquele sítio
  AnswerTests: omnitest(correctVal='É uma variável do sítio, repetida em todas as linhas de indivíduos daquele sítio')
  Hint: "São duas tabelas amassadas numa só: uma de indivíduos e uma de sítios. Guarde isso, porque na aula 06 ela vira um problema de pseudorreplicação."

