- Class: text
  Output: "Pronto! Você auditou as duas tabelas. A planilha ruim tinha problemas de nome de arquivo, cabeçalho, tipos, categorias, duplicatas, datas e ausentes; o arquivo publicado, que é bem melhor, ainda tem coluna derivada guardada, variável de sítio repetida e redundância entre colunas. Nenhum dos dois é caso perdido: o que muda é quanto trabalho sobra para o script da aula 04."
